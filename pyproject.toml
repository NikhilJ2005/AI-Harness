[project]
name = "vibestack"
version = "0.1.0"
description = "Architecture-aware AI harness that generates self-healing FastAPI backends from natural language."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "litellm>=1.40",
    "instructor>=1.3",
    "jinja2>=3.1",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
vibestack = "vibestack.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["vibestack"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
